[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "guardline"
dynamic = ["version"]
description = "One detector library for coding agent guardrails: attribution, environment dumps and token-shaped values."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Lappe" }]
keywords = ["ai-agents", "claude-code", "guardrails", "pre-commit", "secrets", "attribution", "hooks", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pytest-cov>=7"]
lint = ["ruff", "mypy"]

[project.scripts]
guardline = "guardline.cli:main"

[project.urls]
Homepage = "https://github.com/klappe-pm/guardline"
Repository = "https://github.com/klappe-pm/guardline"
Documentation = "https://github.com/klappe-pm/guardline/blob/main/docs/README.md"
Changelog = "https://github.com/klappe-pm/guardline/blob/main/CHANGELOG.md"
Issues = "https://github.com/klappe-pm/guardline/issues"

[tool.hatch.version]
path = "guardline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["guardline"]

[tool.hatch.build.targets.sdist]
include = [
    "/guardline",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/.pre-commit-hooks.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "repo_only: reads repository files that the source distribution omits (.github, docs, the community files); skipped when they are missing",
]

[tool.coverage.run]
source = ["guardline"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["guardline"]
