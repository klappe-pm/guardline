[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardline"
dynamic = ["version"]
description = "One detector library for coding agent guardrails: attribution, environment dumps and token-shaped values."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Lappe" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
guardline = "guardline.cli:main"

[project.urls]
Repository = "https://github.com/klappe-pm/guardline"

[tool.hatch.version]
path = "guardline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["guardline"]
artifacts = ["guardline/data/**"]

[tool.hatch.build.targets.sdist]
include = ["guardline", "tests", "README.md", "LICENSE", "pyproject.toml", ".pre-commit-hooks.yaml"]
artifacts = ["guardline/data/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "repo_only: reads repository files that the source distribution omits (.github, docs, the community files); skipped when they are missing",
]

[tool.coverage.run]
source = ["guardline"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["guardline"]
