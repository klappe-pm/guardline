# Publish to PyPI through trusted publishing when a version tag is pushed.
# The publish job runs in the "pypi" environment, which requires an approval,
# and holds the only id-token permission. No token is stored anywhere.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: install
        run: python -m pip install --upgrade pip build && python -m pip install ".[test]"
      - name: test
        run: python -m pytest -q
      - name: tag matches version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import importlib.metadata as m; print(m.version("guardline"))')"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} does not match version ${version}"; exit 1; }
      - name: build
        run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
